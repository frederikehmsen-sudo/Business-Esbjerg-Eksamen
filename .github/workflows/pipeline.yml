name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test-backend:
    name: Run .NET Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore Business-Esbjerg-Eksamen.slnx

      # Runs both the unit tests (Server/Tests) and the integration tests
      - name: Build and Test
        run: dotnet test Business-Esbjerg-Eksamen.slnx --verbosity normal

  test-e2e:
    name: Run Playwright E2E Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 1. Setup Bun and Client
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install Client Dependencies
        working-directory: ./Client
        run: bun install

      # 2. Setup Node and E2E
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: './tests/E2ETests/package-lock.json'

      - name: Install E2E Dependencies
        working-directory: ./tests/E2ETests
        run: npm ci

      # 3. Setup .NET and Boot the Backend
      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Start .NET API (Background)
        run: dotnet run --project Server/API/API.csproj --launch-profile http &
        env:
          ASPNETCORE_ENVIRONMENT: Development
          JwtSecret: ${{ secrets.JWT_SECRET }}

      - name: Wait for API to be ready
        run: timeout 180 bash -c 'until curl -sf http://localhost:5209/swagger/v1/swagger.json > /dev/null; do sleep 2; done'

      # 4. Install Playwright & OS Dependencies
      - name: Install Playwright Browsers and OS Dependencies
        working-directory: ./tests/E2ETests
        run: npx playwright install --with-deps

      # 5. Run the Tests (the client is started by webServer in playwright.config.ts)
      - name: Run Playwright Tests
        working-directory: ./tests/E2ETests
        run: npx playwright test

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: tests/E2ETests/playwright-report

  deploy:
    name: Deploy to Fly.io
    needs: [test-backend, test-e2e]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy API (business-esbjerg-eksamen)
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}

      - name: Deploy Client (business-esbjerg-client)
        working-directory: ./Client
        run: flyctl deploy --remote-only
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_CLIENT_API_TOKEN }}